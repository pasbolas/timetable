<!doctype html>
<html lang="en" class="bg-black dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Primary Color & Meta -->
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Fast, modern, offline-ready university schedule companion for TU Dublin & DCU students. Real-time schedules, smart breaks, and calendar sync." />
    <meta name="keywords" content="timetable, university, TU Dublin, DCU, schedule, lectures, college timetable, student planner, PWA, Dublin City University, Technological University Dublin" />
    <meta name="author" content="MyTimetable" />
    
    <!-- Open Graph / WhatsApp / Discord / LinkedIn / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MyTimetable" />
    <meta property="og:title" content="MyTimetable — Fast, Offline University Timetable" />
    <meta property="og:description" content="Fast, modern, offline-ready university schedule companion for TU Dublin & DCU students. Real-time schedules, smart breaks, and calendar sync." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="MyTimetable - University Schedule Companion for TU Dublin & DCU" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MyTimetable — Fast, Offline University Timetable" />
    <meta name="twitter:description" content="Fast, modern, offline-ready university schedule companion for TU Dublin & DCU students. Real-time schedules, smart breaks, and calendar sync." />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:image:alt" content="MyTimetable - University Schedule Companion for TU Dublin & DCU" />
    
    <!-- iOS PWA Fullscreen & Seamless Notch Status Bar -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet" />
    
    <script>
      // Capture native PWA beforeinstallprompt immediately at earliest page parse
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaDeferredPrompt = e;
        window.dispatchEvent(new Event('pwa-prompt-available'));
      });
      window.addEventListener('appinstalled', function() {
        window.__pwaDeferredPrompt = null;
        window.dispatchEvent(new Event('pwa-installed-event'));
      });
    </script>
    
    <title>MyTimetable</title>
  </head>
  <body class="bg-black text-white antialiased select-none font-mono min-h-screen">
    <div id="root" class="min-h-screen flex flex-col bg-black text-white"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
